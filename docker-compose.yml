services:
  web:
    build:
      context: ./frontend
    command: npm run dev
    environment:
      # Origen relativo: el navegador llama /api en el mismo origen; Next lo
      # reenvia al backend. Asi la cookie HttpOnly funciona sin cross-site.
      NEXT_PUBLIC_API_URL: ""
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped
    depends_on:
      - api

  api:
    build:
      context: .
    # Aplica migraciones Alembic antes de arrancar; el esquema lo gestiona Alembic.
    command: >
      sh -c "alembic upgrade head &&
      uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    environment:
      APP_ENV: development
      ENABLE_DOCS: "true"
      # "api" incluido: el proxy de Next reenvia con Host=api:8000 (nombre de servicio).
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      DATABASE_URL: postgresql+psycopg://erp_joyeria:${POSTGRES_PASSWORD}@db:5432/erp_joyeria
      # Esquema gestionado por Alembic (no create_all).
      AUTO_CREATE_TABLES: "false"
      # Siembra procesos y catalogo de ejemplo en desarrollo (default true).
      # Ponlo en false en tu .env para arrancar sin datos de ejemplo.
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY}
      CORS_ORIGINS: http://localhost:3000
      # Admin inicial: si no defines SEED_ADMIN_PASSWORD se genera una aleatoria
      # (aparece una vez en los logs del api). Definela en .env para clave fija.
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      # Poner true una vez para forzar el reseteo de la clave del admin existente.
      SEED_ADMIN_RESET_ON_BOOT: ${SEED_ADMIN_RESET_ON_BOOT:-false}
      # Dominio de los correos generados por el sistema (parte despues del @).
      SYSTEM_EMAIL_DOMAIN: ${SYSTEM_EMAIL_DOMAIN:-fenixglobal.online}
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp_joyeria
      POSTGRES_USER: erp_joyeria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Solo accesible desde la maquina local, no expuesto a la red.
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_joyeria -d erp_joyeria"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Cada cuantas horas respaldar y cuantos dias conservar.
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    # Dump comprimido al arrancar y luego cada intervalo; borra los antiguos.
    command: >
      sh -c 'while true; do
      ts=$$(date +%Y%m%d_%H%M%S);
      if pg_dump -h db -U erp_joyeria -d erp_joyeria -F c -f "/backups/erp_joyeria_$${ts}.dump";
      then echo "backup ok: erp_joyeria_$${ts}.dump";
      else echo "backup FALLO $${ts}"; fi;
      find /backups -name "erp_joyeria_*.dump" -mtime +$${BACKUP_RETENTION_DAYS} -delete;
      sleep $$((BACKUP_INTERVAL_HOURS * 3600));
      done'
    volumes:
      - ./backups:/backups
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules: