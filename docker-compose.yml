services:
  web:
    build:
      context: ./frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped
    depends_on:
      - api

  api:
    build:
      context: .
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://erp_joyeria:erp_joyeria@db:5432/erp_joyeria
      AUTO_CREATE_TABLES: "true"
      JWT_SECRET_KEY: dev-change-me
      JWT_REFRESH_SECRET_KEY: dev-change-me
      CORS_ORIGINS: http://localhost:3000
      DEV_AUTH_ENABLED: "false"
      SEED_OWNER_USERNAME: owner
      SEED_OWNER_PASSWORD: Owner123!
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: Admin123!
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp_joyeria
      POSTGRES_USER: erp_joyeria
      POSTGRES_PASSWORD: erp_joyeria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  frontend_node_modules:
