# Stack de produccion. Nada expuesto salvo nginx (80/443).
# Uso: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Requisitos previos:
#   - .env con secretos fuertes (ver .env.example) y APP_ENV=production.
#   - Certificados TLS en ./nginx/certs/ (fullchain.pem, privkey.pem).
#   - DNS del dominio apuntando al servidor.

# Docker no rota logs por defecto: un servicio corriendo meses sin parar
# puede llenar el disco solo con logs. Tope por servicio: 10MB x 3 archivos.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp_joyeria
      POSTGRES_USER: erp_joyeria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    # Sin puertos: solo accesible dentro de la red interna de Docker.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_joyeria -d erp_joyeria"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    # Aplica migraciones Alembic antes de arrancar; luego uvicorn de produccion.
    command: >
      sh -c "alembic upgrade head &&
      uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    environment:
      APP_ENV: production
      ENABLE_DOCS: "false"
      # Con Alembic el esquema lo gestionan las migraciones.
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-false}
      DATABASE_URL: postgresql+psycopg://erp_joyeria:${POSTGRES_PASSWORD}@db:5432/erp_joyeria
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?define JWT_SECRET_KEY en .env}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:?define JWT_REFRESH_SECRET_KEY en .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?define CORS_ORIGINS en .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?define ALLOWED_HOSTS en .env}
      # El admin inicial se crea en el arranque con esta clave (obligatoria).
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?define SEED_ADMIN_PASSWORD en .env}
      # Poner true una vez para forzar el reseteo de la clave del admin existente.
      SEED_ADMIN_RESET_ON_BOOT: ${SEED_ADMIN_RESET_ON_BOOT:-false}
      # Dominio de los correos generados por el sistema (parte despues del @).
      SYSTEM_EMAIL_DOMAIN: ${SYSTEM_EMAIL_DOMAIN:-fenixglobal.online}
    # Sin puertos: nginx habla con api por la red interna.
    restart: always
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Origen relativo: el navegador llama https://DOMAIN/api y nginx enruta al backend.
        NEXT_PUBLIC_API_URL: ""
    # Sin puertos: nginx habla con web por la red interna.
    restart: always
    logging: *default-logging
    depends_on:
      - api

  db-backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Cada cuantas horas respaldar y cuantos dias conservar.
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    # Dump comprimido al arrancar y luego cada intervalo; borra los antiguos.
    command: >
      sh -c 'while true; do
      ts=$$(date +%Y%m%d_%H%M%S);
      if pg_dump -h db -U erp_joyeria -d erp_joyeria -F c -f "/backups/erp_joyeria_$${ts}.dump";
      then echo "backup ok: erp_joyeria_$${ts}.dump";
      else echo "backup FALLO $${ts}"; fi;
      find /backups -name "erp_joyeria_*.dump" -mtime +$${BACKUP_RETENTION_DAYS} -delete;
      sleep $$((BACKUP_INTERVAL_HOURS * 3600));
      done'
    volumes:
      - ./backups:/backups
    restart: always
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    environment:
      DOMAIN: ${DOMAIN:?define DOMAIN en .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_webroot:/var/www/certbot
    restart: always
    logging: *default-logging
    depends_on:
      - api
      - web

  # Solo invocado bajo demanda (deploy/init-tls.sh y deploy/renew-tls.sh),
  # nunca con "up -d": emite/renueva el certificado TLS y lo copia a
  # ./nginx/certs/, que es lo que nginx realmente lee.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_letsencrypt:/etc/letsencrypt
      - ./nginx/certs:/nginx-certs

volumes:
  postgres_data:
  certbot_webroot:
  certbot_letsencrypt:
